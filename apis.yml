aid: inscinstech
name: Inscinstech
description: >-
  Inscinstech (Suzhou Inscinstech Intelligent Technology Co., Ltd.) is a Chinese
  life-sciences instrumentation manufacturer serving the biopharmaceutical
  industry. It designs and builds equipment for oligonucleotide and nucleic-acid
  synthesis, chromatography and protein purification, tangential-flow filtration,
  bioreactors and cell culture, nanomedicine (LNP) preparation, high-pressure
  preparative liquid chromatography, peptide synthesis, and analytical
  instruments (HPLC, capillary electrophoresis, pumps and valves), spanning
  laboratory, pilot, and production scale. It also delivers end-to-end process
  solutions for oligonucleotide drugs, mRNA, peptides, and recombinant proteins.
  The company is backed by Qiming Venture Partners. It is a hardware and
  instruments provider and publishes no public developer API surface at this
  time; this profile is maintained in the API Evangelist network as a company
  record.
